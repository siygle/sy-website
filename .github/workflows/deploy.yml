name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - master
  # Fired by the newsletter admin on publish (repository_dispatch), to rebuild
  # the static pages from D1. Runs on the default branch (master).
  repository_dispatch:
    types: [newsletter-publish]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO }}
          PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
          PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY }}
          PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
          # Newsletter: unset/empty keeps `files` mode (no-op). Set the repo
          # variable NEWSLETTER_SOURCE=cms plus these to build from D1.
          NEWSLETTER_SOURCE: ${{ vars.NEWSLETTER_SOURCE }}
          NEWSLETTER_MEDIA_BASE: ${{ vars.NEWSLETTER_MEDIA_BASE }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.NEWSLETTER_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # files mode: deploy the adapter-generated config (unchanged).
          # cms mode: after provisioning D1/R2, copy wrangler.jsonc.example to
          # wrangler.jsonc, fill it in, verify `wrangler deploy --dry-run`, then
          # change this to `deploy` so the root config's bindings are used.
          command: deploy --config dist/server/wrangler.json
